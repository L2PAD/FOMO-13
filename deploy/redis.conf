[program:redis]
; Redis — used by the NestJS backend for express-session store + Bull queues.
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --daemonize no
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/redis.err.log
stdout_logfile=/var/log/supervisor/redis.out.log
stopsignal=TERM
stopwaitsecs=10
