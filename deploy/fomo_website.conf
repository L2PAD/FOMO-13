[program:fomo_website]
; FOMO public website (Next.js, fomo_v2_architecture branch).
; Served on port 3001. Points to the SAME backend the admin uses
; (configured via /app/website_front/.env.local, generated by bootstrap.sh).
command=/usr/bin/node node_modules/next/dist/bin/next start -p 3001 -H 0.0.0.0
directory=/app/website_front
autostart=true
autorestart=true
startsecs=15
startretries=5
environment=NODE_ENV="production",PORT="3001"
stderr_logfile=/var/log/supervisor/fomo_website.err.log
stdout_logfile=/var/log/supervisor/fomo_website.out.log
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
