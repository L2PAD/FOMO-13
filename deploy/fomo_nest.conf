[program:fomo_nest]
; FOMO NestJS backend on internal port 5000. The FastAPI proxy (program:backend)
; on 8001 forwards all /api ingress traffic here.
command=/usr/bin/node dist/main.js
directory=/app/fomo-backend
autostart=true
autorestart=true
startsecs=12
startretries=5
environment=NODE_ENV="development",PORT="5000"
stderr_logfile=/var/log/supervisor/fomo_nest.err.log
stdout_logfile=/var/log/supervisor/fomo_nest.out.log
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
