services:
  fomo-frontend-production:
    container_name: fomo-frontend-production
    image: fomo-frontend-production:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.fomo.cx}
        NEXT_PUBLIC_LOADER_API: ${NEXT_PUBLIC_LOADER_API:-https://api.fomo.cx}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://fomo.cx}
        NEXT_PUBLIC_FRONT_URL: ${NEXT_PUBLIC_FRONT_URL:-https://fomo.cx}
        NEXT_PUBLIC_REF_LINK: ${NEXT_PUBLIC_REF_LINK:-https://fomo.cx/ref/}
        NEXT_PUBLIC_DISCORD_CLIENT_ID: ${NEXT_PUBLIC_DISCORD_CLIENT_ID:-}
        NEXT_PUBLIC_TELEGRAM_BOT_LINK: ${NEXT_PUBLIC_TELEGRAM_BOT_LINK:-}
        NEXT_PUBLIC_BACKERS_V2: ${NEXT_PUBLIC_BACKERS_V2:-true}
        NEXT_PUBLIC_FUNDS_DETAIL_V2: ${NEXT_PUBLIC_FUNDS_DETAIL_V2:-true}
        NEXT_PUBLIC_PERSONS_DETAIL_V2: ${NEXT_PUBLIC_PERSONS_DETAIL_V2:-true}
        NEXT_PUBLIC_COMPARISON_PERF_LOGS: ${NEXT_PUBLIC_COMPARISON_PERF_LOGS:-false}
        API_BASE_URL: ${API_BASE_URL:-https://api.fomo.cx}
        DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-https://api.fomo.cx/api/discord}
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./.env.production
    restart: unless-stopped
